<div class="h-screen w-screen flex justify-center items-center">

  <form [formGroup]="reactiveform" (ngSubmit)="senddata()" class="flex flex-col  text-white rounded-lg  h-[30%]  p-5 justify-center items-center" >
<label for="name">username:<input type="text" formControlName="username" placeholder="enter your name..."></label>
@if (reactiveform.get('username')?.invalid && reactiveform.get('username')?.touched) {<small class="text-red-600">username invalid</small>}

<label for="name">password<input type="password" formControlName="password" placeholder="enter your password..."></label>
<button type="submit" [disabled]="reactiveform.invalid" class="bg-green-500 rounded-lg hover:bg-green-700 transition-all p-2 hover:scale-110 hover:rotate-6">send</button>
</form>
</div>
